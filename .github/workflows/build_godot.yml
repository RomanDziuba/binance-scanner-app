name: Build Godot Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot Export Templates
        run: |
          apt-get update && apt-get install -y wget unzip
          TARGET_DIR="/root/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TARGET_DIR"
          if [ ! -f "$TARGET_DIR/android_debug.apk" ]; then
            echo "📥 Загрузка шаблонов экспорта Godot 4.3..."
            wget -q -O export_templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
            unzip -q -o export_templates.tpz
            if [ -d "templates" ]; then
              cp -r templates/* "$TARGET_DIR/"
              rm -rf templates
            fi
            rm -f export_templates.tpz
            echo "✅ Шаблоны успешно установлены!"
          fi

      - name: Configure Android SDK, Java & Keystore
        run: |
          mkdir -p /root/.config/godot
          mkdir -p /root/.local/share/godot
          
          JAVA_PATH="$(readlink -f$(which javac) || true)"
          if [ -n "$JAVA_PATH" ]; then
            JAVA_SDK_DIR="$(dirname $(dirname "$JAVA_PATH"))"
          else
            JAVA_SDK_DIR="/usr/lib/jvm/default-java"
          fi
          echo "Resolved Java SDK path: $JAVA_SDK_DIR"

          ANDROID_SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/root/android-sdk}}"
          if [ ! -d "$ANDROID_SDK_DIR" ]; then
            if [ -d "/opt/android-sdk" ]; then
              ANDROID_SDK_DIR="/opt/android-sdk"
            fi
          fi
          echo "Resolved Android SDK path: $ANDROID_SDK_DIR"

          SDKMANAGER_PATH=$(find "$ANDROID_SDK_DIR" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER_PATH" ]; then
            yes | "$SDKMANAGER_PATH" --licenses || true
            "$SDKMANAGER_PATH" "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
          fi

          KEYSTORE_PATH="/root/.local/share/godot/debug.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkey -v -keystore "$KEYSTORE_PATH" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -deststoretype pkcs12 -passin pass:android -passout pass:android -dname "CN=Android Debug,O=Android,C=US" || true
          fi
          
          cat << EOF > /root/.config/godot/editor_settings-4.3.tres
[gd_resource type="EditorSettings" load_format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_SDK_DIR"
export/android/java_sdk_path = "$JAVA_SDK_DIR"
export/android/debug_keystore = "$KEYSTORE_PATH"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF

      - name: Compile Android APK
        run: |
          mkdir -p build/android
          godot --verbose --headless --export-debug "Android" build/android/game.apk

      - name: Upload APK to Telegram Bot
        if: success()
        run: |
          APK_PATH=$(find build/android -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            curl -F chat_id="1434233986" -F document=@"$APK_PATH" https://api.telegram.org/bot8815256130:AAEW6brOnE5NpvsgzvZbfm87b3X7bFzaw9Y/sendDocument
          else
            echo "❌ Ошибка: APK файл не обнаружен!"
            exit 1
          fi
