name: Build Godot Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download & Setup Export Templates via Python
        run: |
          python3 -c "
          import urllib.request, zipfile, os, shutil
          target_dir = os.path.expanduser('~/.local/share/godot/export_templates/4.3.stable')
          if os.path.exists(os.path.join(target_dir, 'android_debug.apk')):
              print('✅ Шаблоны экспорта уже установлены.')
          else:
              print('📥 Скачивание шаблонов экспорта Godot 4.3...')
              url = 'https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz'
              urllib.request.urlretrieve(url, 'export_templates.tpz')
              
              print('📦 Распаковка архива шаблонов...')
              with zipfile.ZipFile('export_templates.tpz', 'r') as zip_ref:
                  zip_ref.extractall('templates_extracted')
                  
              os.makedirs(target_dir, exist_ok=True)
              src_dir = 'templates_extracted/templates'
              if os.path.exists(src_dir):
                  for item in os.listdir(src_dir):
                      s = os.path.join(src_dir, item)
                      d = os.path.join(target_dir, item)
                      if os.path.isdir(s):
                          if os.path.exists(d): shutil.rmtree(d)
                          shutil.copytree(s, d)
                      else:
                          shutil.copy2(s, d)
              print('✅ Шаблоны успешно установлены!')
          "

      - name: Configure Android SDK Environment & Keystore
        run: |
          mkdir -p ~/.config/godot/
          echo "ANDROID_HOME=/root/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/root/android-sdk" >> $GITHUB_ENV
          
          keytool -genkey -v -keystore ~/.local/share/godot/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -deststoretype pkcs12 -passin pass:android -passout pass:android -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Generate Import Cache & Validate
        run: |
          godot --verbose --headless --editor --quit || true

      - name: Compile Android APK
        run: |
          mkdir -p build/android
          godot --verbose --headless --export-debug "Android" build/android/game.apk

      - name: Upload APK to Telegram
        if: success()
        run: |
          APK_PATH=$(find build/android -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            curl -F chat_id="1434233986" -F document=@"$APK_PATH" https://api.telegram.org/bot8815256130:AAEW6brOnE5NpvsgzvZbfm87b3X7bFzaw9Y/sendDocument
          else
            echo "❌ APK файл не найден после компиляции!"
            exit 1
          fi
