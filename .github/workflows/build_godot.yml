name: Build Godot Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Godot Editor Settings for Android
        run: |
          mkdir -p ~/.config/godot/
          mkdir -p /root/.local/share/godot/
          
          # Пути к SDK и Java, предустановленные в контейнере barichello/godot-ci:4.3
          ANDROID_SDK_DIR="/opt/android-sdk"
          JAVA_SDK_DIR="/usr/lib/jvm/default-java"
          
          KEYSTORE_PATH="/root/.local/share/godot/debug.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkey -v -keystore "$KEYSTORE_PATH" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -deststoretype pkcs12 -passin pass:android -passout pass:android -dname "CN=Android Debug,O=Android,C=US" || true
          fi
          
          cat << EOF > ~/.config/godot/editor_settings-4.3.tres
          [gd_resource type="EditorSettings" load_format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_DIR"
          export/android/java_sdk_path = "$JAVA_SDK_DIR"
          export/android/debug_keystore = "$KEYSTORE_PATH"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "✅ Конфигурация EditorSettings успешно создана."

      - name: Compile Android APK
        run: |
          mkdir -p build/android
          godot --verbose --headless --export-debug "Android" build/android/game.apk

      - name: Upload APK to Telegram Bot
        if: success()
        run: |
          APK_PATH=$(find build/android -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            curl -F chat_id="1434233986" -F document=@"$APK_PATH" https://api.telegram.org/bot8815256130:AAEW6brOnE5NpvsgzvZbfm87b3X7bFzaw9Y/sendDocument
          else
            echo "❌ Ошибка: APK файл не обнаружен после завершения сборки!"
            exit 1
          fi
