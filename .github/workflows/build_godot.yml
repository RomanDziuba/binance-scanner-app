name: Build Godot Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Wget/Unzip & Download Export Templates
        run: |
          apt-get update && apt-get install -y wget unzip openjdk-17-jdk
          
          TARGET_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TARGET_DIR"
          
          if [ ! -f "$TARGET_DIR/android_debug.apk" ]; then
            echo "📥 Скачивание шаблонов экспорта Godot 4.3..."
            wget -q -O export_templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
            unzip -q export_templates.tpz
            if [ -d "templates" ]; then
              cp -r templates/* "$TARGET_DIR/"
            fi
            echo "✅ Шаблоны успешно установлены!"
          fi

      - name: Install Android SDK and Build Tools
        run: |
          apt-get update && apt-get install -y curl unzip
          
          ANDROID_SDK_ROOT="/opt/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"
          
          echo "📥 Скачивание Android SDK Command Line Tools..."
          curl -sS -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          
          # Правильная структура папок для sdkmanager
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/latest/ 2>/dev/null || true
          mv cmdline-tools/lib cmdline-tools/latest/ 2>/dev/null || true
          mv cmdline-tools/NOTICE.txt cmdline-tools/latest/ 2>/dev/null || true
          mv cmdline-tools/source.properties cmdline-tools/latest/ 2>/dev/null || true
          
          export ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          
          echo "📋 Принятие лицензий Android SDK..."
          yes | sdkmanager --licenses || true
          
          echo "📥 Установка компонентов Android SDK (несколько версий)..."
          sdkmanager "platform-tools" "platforms;android-33" "platforms;android-34" "build-tools;33.0.2" "build-tools;34.0.0"
          
          # Сохраняем переменные окружения для следующих шагов
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV
          
          echo "✅ Android SDK успешно установлен!"
          echo "Установленные пакеты:"
          sdkmanager --list_installed || true

      - name: Configure Godot Editor Settings for Android & Java SDK
        run: |
          mkdir -p ~/.config/godot/
          mkdir -p /root/.local/share/godot/
          
          # Определяем путь к Java
          JAVA_SDK_DIR="${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
          if [ ! -d "$JAVA_SDK_DIR/bin" ]; then
            JAVA_BIN=$(command -v java || echo "")
            if [ -n "$JAVA_BIN" ]; then
              JAVA_REAL=$(readlink -f "$JAVA_BIN")
              JAVA_SDK_DIR=$(dirname "$(dirname "$JAVA_REAL")")
            fi
          fi
          
          # Используем установленный SDK
          ANDROID_SDK_DIR="${ANDROID_HOME:-/opt/android-sdk}"
          
          echo "Java SDK path: $JAVA_SDK_DIR"
          echo "Android SDK path: $ANDROID_SDK_DIR"
          
          # Генерация debug.keystore
          KEYSTORE_PATH="/root/.local/share/godot/debug.keystore"
          keytool -genkey -v -keystore "$KEYSTORE_PATH" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -deststoretype pkcs12 -passin pass:android -passout pass:android -dname "CN=Android Debug,O=Android,C=US" || true
          
          # ВАЖНО: файл настроек без пробелов в начале строк!
          cat << EOF > ~/.config/godot/editor_settings-4.3.tres
[gd_resource type="EditorSettings" load_steps=0 format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_SDK_DIR"
export/android/java_sdk_path = "$JAVA_SDK_DIR"
export/android/debug_keystore = "$KEYSTORE_PATH"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF

          echo "✅ Конфигурация EditorSettings успешно создана."
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Generate Import Cache & Validate
        run: |
          godot --verbose --headless --editor --quit || true

      - name: Compile Android APK
        run: |
          mkdir -p build/android
          godot --verbose --headless --export-debug "Android" build/android/game.apk

      - name: Upload APK to Telegram
        if: success()
        run: |
          APK_PATH=$(find build/android -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            curl -F chat_id="1434233986" -F document=@"$APK_PATH" https://api.telegram.org/bot8815256130:AAEW6brOnE5NpvsgzvZbfm87b3X7bFzaw9Y/sendDocument
          else
            echo "❌ APK файл не найден после компиляции!"
            exit 1
          fi
