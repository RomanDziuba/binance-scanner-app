name: Build Godot Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Godot Android SDK & Editor Settings
        run: |
          python3 -c "
          import os
          sdk_path = os.environ.get('ANDROID_HOME', os.environ.get('ANDROID_SDK_ROOT', '/root/android-sdk'))
          config_dir = os.path.expanduser('~/.config/godot')
          os.makedirs(config_dir, exist_ok=True)
          settings_file = os.path.join(config_dir, 'editor_settings-4.tres')
          
          content = '''[resource]

export/android/android_sdk_path = \"%s\"
''' % sdk_path
          
          with open(settings_file, 'w') as f:
              f.write(content)
          print(f'✅ Android SDK path configured: {sdk_path}')
          "

      - name: Generate Import Cache
        run: |
          godot --verbose --headless --editor --quit || true

      - name: Compile Android APK
        run: |
          mkdir -p build/android
          godot --verbose --headless --export-debug "Android" build/android/game.apk

      - name: Upload APK to Telegram
        if: success()
        run: |
          APK_PATH=$(find build/android -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            curl -F chat_id="1434233986" -F document=@"$APK_PATH" https://api.telegram.org/bot8815256130:AAEW6brOnE5NpvsgzvZbfm87b3X7bFzaw9Y/sendDocument
          fi
