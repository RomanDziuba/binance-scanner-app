name: Build Godot Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Android SDK for Godot
        run: |
          python3 -c '
          import os
          sdk = os.environ.get("ANDROID_HOME", "/opt/android-sdk")
          config_dir = os.path.expanduser("~/.config/godot")
          os.makedirs(config_dir, exist_ok=True)
          settings_path = os.path.join(config_dir, "editor_settings-4.tres")
          content = f"""[gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "{sdk}"
          """
          with open(settings_path, "w") as f:
              f.write(content)
          print(f"✅ Android SDK успешно привязан по пути: {sdk}")
          '

      - name: Generate Import Cache
        run: |
          godot --verbose --headless --editor --quit || true

      - name: Compile Android APK
        run: |
          mkdir -p build/android
          godot --verbose --headless --export-debug "Android" build/android/game.apk

      - name: Upload APK to Telegram
        if: success()
        run: |
          APK_PATH=$(find build/android -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            curl -F chat_id="1434233986" -F document=@"$APK_PATH" https://api.telegram.org/bot8815256130:AAEW6brOnE5NpvsgzvZbfm87b3X7bFzaw9Y/sendDocument
          fi
