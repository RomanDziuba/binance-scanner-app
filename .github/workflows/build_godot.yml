name: Build Godot Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_godot.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Wget/Unzip & Download Export Templates
        run: |
          apt-get update && apt-get install -y wget unzip
          TARGET_DIR="/github/home/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TARGET_DIR"
          if [ ! -f "$TARGET_DIR/android_debug.apk" ]; then
            echo "📥 Загрузка шаблонов экспорта Godot 4.3..."
            wget -q -O export_templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
            unzip -q -o export_templates.tpz
            if [ -d "templates" ]; then
              cp -r templates/* "$TARGET_DIR/"
              rm -rf templates
            fi
            rm -f export_templates.tpz
            echo "✅ Шаблоны успешно установлены!"
          fi

      - name: Configure Android SDK, Java SDK & Keystore
        run: |
          mkdir -p ~/.config/godot/
          mkdir -p /github/home/.local/share/godot/
          
          JAVA_SDK_DIR="${JAVA_HOME:-}"
          if [ -z "$JAVA_SDK_DIR" ] ert{}ert{} [ ! -d "$JAVA_SDK_DIR/bin" ]; then
            JAVAC_BIN="$(command -v javac || true)"
            if [ -n "$JAVAC_BIN" ]; then
              REAL_PATH="$(readlink -f "$JAVAC_BIN" ert{}ert{} echo "$JAVAC_BIN")"
              if [ -n "$REAL_PATH" ]; then
                JAVA_SDK_DIR="$(dirname "$(dirname "$REAL_PATH")")"
              fi
            fi
          fi
          
          if [ -z "$JAVA_SDK_DIR" ] ert{}ert{} [ ! -d "$JAVA_SDK_DIR/bin" ]; then
            if [ -d "/usr/lib/jvm/default-java" ]; then
              JAVA_SDK_DIR="/usr/lib/jvm/default-java"
            elif [ -d "/usr/lib/jvm/java-17-openjdk-amd64" ]; then
              JAVA_SDK_DIR="/usr/lib/jvm/java-17-openjdk-amd64"
            else
              JAVA_SDK_DIR="/usr/lib/jvm/java-11-openjdk-amd64"
            fi
          fi
          
          echo "Resolved Java SDK path: $JAVA_SDK_DIR"
          ANDROID_SDK_DIR="/opt/android-sdk"
          
          SDKMANAGER_PATH=$(find "$ANDROID_SDK_DIR" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER_PATH" ]; then
            yes | "$SDKMANAGER_PATH" --licenses || true
            "$SDKMANAGER_PATH" "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
          fi

          KEYSTORE_PATH="/github/home/.local/share/godot/debug.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkey -v -keystore "$KEYSTORE_PATH" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -deststoretype pkcs12 -passin pass:android -passout pass:android -dname "CN=Android Debug,O=Android,C=US" || true
          fi
          
          # Безопасная генерация editor_settings через echo
          echo '[gd_resource type="EditorSettings" load_format=3]' > ~/.config/godot/editor_settings-4.3.tres
          echo '' >> ~/.config/godot/editor_settings-4.3.tres
          echo '[resource]' >> ~/.config/godot/editor_settings-4.3.tres
          echo 'export/android/android_sdk_path = "/opt/android-sdk"' >> ~/.config/godot/editor_settings-4.3.tres
          echo 'export/android/java_sdk_path = "/usr/lib/jvm/default-java"' >> ~/.config/godot/editor_settings-4.3.tres
          echo 'export/android/debug_keystore = "/github/home/.local/share/godot/debug.keystore"' >> ~/.config/godot/editor_settings-4.3.tres
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> ~/.config/godot/editor_settings-4.3.tres
          echo 'export/android/debug_keystore_pass = "android"' >> ~/.config/godot/editor_settings-4.3.tres

      - name: Compile Android APK
        run: |
          mkdir -p build/android
          godot --verbose --headless --export-debug "Android" build/android/game.apk

      - name: Upload APK to Telegram Bot
        if: success()
        run: |
          APK_PATH=$(find build/android -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            curl -F chat_id="1434233986" -F document=@"$APK_PATH" https://api.telegram.org/bot8815256130:AAEW6brOnE5NpvsgzvZbfm87b3X7bFzaw9Y/sendDocument
          else
            echo "❌ Ошибка: APK файл не обнаружен!"
            exit 1
          fi
