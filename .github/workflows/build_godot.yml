name: Build Godot Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Wget/Unzip & Download Export Templates
        run: |
          apt-get update && apt-get install -y wget unzip
          
          TARGET_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TARGET_DIR"
          
          if [ ! -f "$TARGET_DIR/android_debug.apk" ]; then
            echo "📥 Скачивание шаблонов экспорта Godot 4.3..."
            wget -q -O export_templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
            unzip -q -o export_templates.tpz
            if [ -d "templates" ]; then
              cp -r templates/* "$TARGET_DIR/"
              rm -rf templates
            fi
            rm -f export_templates.tpz
            echo "✅ Шаблоны успешно установлены в $TARGET_DIR!"
          fi

      - name: Configure Godot Editor Settings for Android & Java SDK
        run: |
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot"
          
          JAVA_SDK_DIR="${JAVA_HOME:-/usr/lib/jvm/default-java}"
          if [ ! -d "$JAVA_SDK_DIR/bin" ]; then
            JAVA_BIN=$(command -v java || echo "")
            if [ -n "$JAVA_BIN" ]; then
              JAVA_REAL=$(readlink -f "$JAVA_BIN")
              JAVA_SDK_DIR=$(dirname "$(dirname "$JAVA_REAL")")
            fi
          fi
          
          ANDROID_SDK_DIR="${ANDROID_HOME:-/opt/android-sdk}"
          if [ ! -d "$ANDROID_SDK_DIR" ]; then
            FOUND_SDK=$(find / -name "android-sdk" -type d 2>/dev/null | head -n 1)
            [ -n "$FOUND_SDK" ] && ANDROID_SDK_DIR="$FOUND_SDK"
          fi
          
          echo "Java SDK path: $JAVA_SDK_DIR"
          echo "Android SDK path: $ANDROID_SDK_DIR"
          
          SDKMANAGER_PATH=$(find "$ANDROID_SDK_DIR" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER_PATH" ]; then
            echo "📦 Найден sdkmanager: $SDKMANAGER_PATH"
            yes | "$SDKMANAGER_PATH" --licenses || true
            "$SDKMANAGER_PATH" "platform-tools" "platforms;android-33" "build-tools;33.0.2" "platforms;android-34" "build-tools;34.0.0" || true
          fi

          KEYSTORE_PATH="$HOME/.local/share/godot/debug.keystore"
          keytool -genkey -v -keystore "$KEYSTORE_PATH" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -deststoretype pkcs12 -passin pass:android -passout pass:android -dname "CN=Android Debug,O=Android,C=US" || true
          
          cat << EOF > "$HOME/.config/godot/editor_settings-4.3.tres"
          [gd_resource type="EditorSettings" load_format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_DIR"
          export/android/java_sdk_path = "$JAVA_SDK_DIR"
          export/android/debug_keystore = "$KEYSTORE_PATH"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "✅ Конфигурация EditorSettings успешно создана в $HOME."

      - name: Generate Export Presets with Correct Paths
        run: |
          cat << EOF > export_presets.cfg
          [preset.0]

          name = "Android"
          platform = "Android"
          runnable = false
          custom_features = ""
          export_filter = "all_resources"
          include_filter = ""
          exclude_filter = ""
          export_path = "build/android/game.apk"
          encryption_include_filters = ""
          encryption_exclude_filters = ""
          encrypt_pck = false
          encrypt_directory = false

          [preset.0.options]
          custom_template/debug = ""
          custom_template/release = ""
          command_line/arguments = ""
          startup_script/enabled = false
          startup_script/path = ""
          screen/orientation = ${ ' }}if [ "{project_config["orientation"]}" = "portrait" ]; then echo 1; else echo 2; fi${{ ' }
          textures/vram_compression/import_astc = false
          textures/vram_compression/import_bptc = false
          textures/vram_compression/import_s3tc = false
          application/define_version_code = true
          application/version_code = 1
          application/version_name = "1.0"
          package/unique_name = "roma.tetris.game"
          keystore/debug = "$HOME/.local/share/godot/debug.keystore"
          keystore/debug_user = "androiddebugkey"
          keystore/debug_password = "android"
          keystore/release = ""
          keystore/release_user = ""
          keystore/release_password = ""
          permissions/internet = true
          permissions/access_network_state = true
          permissions/write_external_storage = true
          permissions/read_external_storage = true
          permissions/camera = true
          permissions/record_audio = true
          permissions/access_fine_location = true
          permissions/access_coarse_location = true
          permissions/bluetooth = true
          permissions/wake_lock = true
          architectures/arm64 = true
          architectures/armv7 = true
          EOF
          echo "✅ export_presets.cfg сгенерирован."

      - name: Generate Import Cache & Validate
        run: |
          godot --verbose --headless --editor --quit || true

      - name: Compile Android APK
        run: |
          mkdir -p build/android
          godot --verbose --headless --export-debug "Android" build/android/game.apk

      - name: Upload APK to Telegram
        if: success()
        run: |
          APK_PATH=$(find build/android -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            curl -F chat_id="1434233986" -F document=@"$APK_PATH" https://api.telegram.org/bot8815256130:AAEW6brOnE5NpvsgzvZbfm87b3X7bFzaw9Y/sendDocument
          else
            echo "❌ APK файл не найден после компиляции!"
            exit 1
          fi
