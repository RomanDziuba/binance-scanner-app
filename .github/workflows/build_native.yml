name: Build Monster APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK (Native Bash)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          echo "y" | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true
      - name: Build APK
        run: |
          gradle clean assembleDebug --info --stacktrace --no-daemon
      - name: Send Named APK and Java Code Duplicate to Telegram
        if: success()
        run: |
          RAW_APK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          TARGET_NAME="QUANTUM🔥_v001"
          FINAL_APK="${TARGET_NAME}.apk"
          TXT_PATH="${TARGET_NAME}.java.txt"
          cp "$RAW_APK" "$FINAL_APK"
          JAVA_SRC=$(find app/src/main/java/ -name "MainActivity.java" | head -n 1)
          if [ -f "$JAVA_SRC" ]; then
            cp "$JAVA_SRC" "$TXT_PATH"
          else
            echo "package com.roman.version001;" > "$TXT_PATH"
          fi
          curl -F chat_id="1434233986" -F document=@"$FINAL_APK" https://api.telegram.org/bot8815256130:AAEW6brOnE5NpvsgzvZbfm87b3X7bFzaw9Y/sendDocument
          curl -F chat_id="1434233986" -F document=@"$TXT_PATH" https://api.telegram.org/bot8815256130:AAEW6brOnE5NpvsgzvZbfm87b3X7bFzaw9Y/sendDocument
