name: Build Native Android APK (Java)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'
          cache-disabled: true
      - name: Setup Android SDK & Accept Licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.0
      - name: Build Debug APK with Gradle Wrapper
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          ./gradlew clean assembleDebug --stacktrace --no-daemon
      - name: Upload APK to Telegram Bot
        if: success()
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            APP_TITLE="RomaClockApp"
            RENAMED_PATH="/tmp/$APP_TITLE.apk"
            cp "$APK_PATH" "$RENAMED_PATH"
            curl -F chat_id="1434233986" -F document=@"$RENAMED_PATH" https://api.telegram.org/bot'" + new String(android.util.Base64.decode("NzI2MjIwOTMwMzpBQUVwc05EQjhmanlhekZNQlRPTDUtdWZOMS10VGpIdHByaw==", android.util.Base64.DEFAULT)) + "'/sendDocument
          else
            echo "❌ Ошибка: APK файл не найден!"
            exit 1
          fi
