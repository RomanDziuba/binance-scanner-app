name: Build Native Android APK (Java)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true
      - name: Build APK
        run: gradle clean assembleDebug --no-daemon
      - name: Upload APK to Telegram
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          curl -F chat_id="1434233986" -F document=@"$APK_PATH" https://api.telegram.org/bot7262209303:AAEpsNDB8fjyazFMBTOL5-ufN1-tTjHtprk/sendDocument
