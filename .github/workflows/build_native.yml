name: Build Monster APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK (Native Bash)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          echo "y" | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true
      - name: Build APK
        run: |
          gradle clean assembleDebug --info --stacktrace --no-daemon
      - name: Prepare TXT Duplicate and Send to Telegram
        if: success()
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          BASENAME=$(basename "$APK_PATH" .apk)
          TXT_PATH="app/build/outputs/apk/debug/${BASENAME}.txt"
          echo "Monster App Build Report: $BASENAME" > "$TXT_PATH"
          echo "Package: com.monstercompiler.app" >> "$TXT_PATH"
          echo "Version: 5.1" >> "$TXT_PATH"
          echo "Smart Update Enabled: Allowed smooth update/install without duplicate prompts if version matches." >> "$TXT_PATH"
          curl -F chat_id="1434233986" -F document=@"$APK_PATH" https://api.telegram.org/bot8815256130:AAEW6brOnE5NpvsgzvZbfm87b3X7bFzaw9Y/sendDocument
          curl -F chat_id="1434233986" -F document=@"$TXT_PATH" https://api.telegram.org/bot8815256130:AAEW6brOnE5NpvsgzvZbfm87b3X7bFzaw9Y/sendDocument
