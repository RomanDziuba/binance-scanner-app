name: Build Monster APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK (Native Bash)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true
      - name: Build APK
        run: |
          gradle clean assembleDebug --info --stacktrace --no-daemon
      - name: Prepare APK and Java Code Duplicate
        run: |
          RAW_APK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          TARGET_NAME="APCMI_v1"
          FINAL_APK="${TARGET_NAME}.apk"
          TXT_PATH="${TARGET_NAME}.java.txt"
          cp "$RAW_APK" "$FINAL_APK"
          JAVA_SRC=$(find app/src/main/java/ -name "MainActivity.java" | head -n 1)
          if [ -f "$JAVA_SRC" ]; then
            cp "$JAVA_SRC" "$TXT_PATH"
          else
            echo "package com.apcmi.version1;" > "$TXT_PATH"
          fi
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "APCMI_v1"
          path: |
            *.apk
            *.java.txt
