name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            pkg-config \
            ant \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            m4 \
            gettext \
            gettext-base \
            autopoint \
            unzip \
            zip \
            ncurses-dev \
            libncurses5 \
            libstdc++6:i386 \
            libz1:i386
          sudo ln -sf /usr/bin/autopoint /usr/local/bin/autopoint

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.33 "setuptools<=65.5.0" wheel
          pip install "charset-normalizer<3.5.0"

      - name: Deep clean build directories and pip cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf ~/.cache/pip
          pip cache purge || true

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK to Telegram
        if: success()
        run: |
          APK_PATH=$(find bin -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            curl -F chat_id="1434233986" -F document=@"$APK_PATH" https://api.telegram.org/bot8815256130:AAEW6brOnE5NpvsgzvZbfm87b3X7bFzaw9Y/sendDocument
          fi
