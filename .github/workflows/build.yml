name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev
          pip install --upgrade buildozer cython==0.29.33 "setuptools<=65.5.0"

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK to Telegram
        if: success()
        run: |
          APK_PATH=$(find bin/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            curl -F chat_id="1434233986" -F document=@"$APK_PATH" https://api.telegram.org/bot8815256130:AAEW6brOnE5NpvsgzvZbfm87b3X7bFzaw9Y/sendDocument
          fi
