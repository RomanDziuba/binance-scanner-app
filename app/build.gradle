plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kompilyator4.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.kompilyator4.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.4"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
